name: CI

# Runs on every push and pull request targeting main. Six independent jobs
# (backend, frontend, secrets scan, docker build, real-tectonic, docker full
# suite) run in parallel. The last one only executes on a push to main, not
# on pull_request. See its own job below for why.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default. None of these jobs need write access, only
# checkout and test/build. Set explicitly rather than relying on the
# repo/org's default GITHUB_TOKEN permissions.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        # AWS ECR Public mirror of the Docker Official postgres image, not
        # Docker Hub directly. Sidesteps Docker Hub's anonymous-pull rate
        # limiting, the most common cause of GitHub-hosted runners timing out
        # ("context deadline exceeded") while pulling service containers.
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manifestcv_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d manifestcv_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        # Same ECR Public mirror reasoning as postgres above.
        image: public.ecr.aws/docker/library/redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # Test-only values, never real secrets. Settings requires every one of
      # these to be set, so CI provides them as environment variables
      # instead of using a checked-in .env file.
      BACKEND_BASE_URL: http://localhost:8000
      FRONTEND_BASE_URL: http://localhost:5173

      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/manifestcv_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manifestcv_ci

      SECRET_KEY: ci-test-secret-key-not-for-production-use-only

      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_MINUTES: "43200"
      JWT_ALGORITHM: HS256
      RESET_TOKEN_EXPIRE_MINUTES: "60"

      GOOGLE_CLIENT_ID: ci-test-google-client-id
      GOOGLE_CLIENT_SECRET: ci-test-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/oauth2/callback/google

      REDIS_URL: redis://localhost:6379/0
      CACHE_DEFAULT_TTL: "300"

      FROM_EMAIL: ci-test@example.com
      GMAIL_APP_PASSWORD: ci-test-app-password

      APP_NAME: ManifestCV

      LOGIN_LOCKOUT_TIME: "300"
      MAX_FAILED_LOGIN_ATTEMPTS: "5"
      LOGIN_LOCKOUT_TIME_PER_IP: "300"
      MAX_FAILED_LOGIN_ATTEMPTS_PER_IP: "20"

      MAX_REQUESTS_PER_WINDOW: "100"
      REQUEST_WINDOW_SECONDS: "60"

      # GEMINI_API_KEY has no default (Settings refuses to start without
      # it), so CI needs *something*, same as every other required setting
      # above. A placeholder is fine because the integration suite mocks
      # every Gemini/Qdrant call at each route module's import site rather
      # than calling either service for real (see
      # tests/backend/app/integration/*'s module docstrings). Nothing here
      # ever needs to resolve to a live key or a reachable Qdrant instance,
      # so no `qdrant` service container is spun up, unlike `postgres`/`redis`.
      GEMINI_API_KEY: ci-test-gemini-api-key
      GEMINI_MODEL: gemini-flash-latest
      GEMINI_EMBEDDING_MODEL: gemini-embedding-001
      QDRANT_URL: http://localhost:6333

      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install --no-cache-dir -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Audit Python dependencies for known vulnerabilities
        run: |
          pip install --no-cache-dir pip-audit
          pip-audit -r backend/requirements.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app mystic_auth alembic ../tests/backend

      - name: Type-check (mypy)
        working-directory: backend
        run: mypy app mystic_auth

      # Scoped to both app (ManifestCV's own code) and mystic_auth (the
      # vendored template), matching upstream's own CI exactly.
      # pyproject.toml's [tool.bandit] skips the one rule (B105) that
      # otherwise false-positives on event-name constants shared by both trees.
      - name: Security scan (bandit)
        working-directory: backend
        run: bandit -r app mystic_auth -c pyproject.toml

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      # Regression guard. Fails if a model's columns/indexes drift from
      # what the migrations actually create.
      - name: Verify models match migrations (alembic check)
        working-directory: backend
        run: alembic check

      # tests/backend/app covers ManifestCV's own domains, tests/backend/mystic_auth/unit
      # covers the vendored mystic_auth package. Both are fast and DB-free, so they
      # run together as one coverage base.
      - name: Run backend unit tests
        run: python -m pytest tests/backend/app/unit tests/backend/mystic_auth/unit -q

      # --cov-append accumulates onto the unit run's coverage data instead
      # of starting fresh, so the threshold at the security step gates
      # cumulative unit+integration+security coverage (~87% currently), not
      # any single suite in isolation.
      - name: Run backend integration tests
        run: python -m pytest tests/backend/app/integration tests/backend/mystic_auth/integration -q --cov-append

      # Coverage is currently ~92% (see docs/app/testing/overview.md). The gate
      # sits a few points below that as a regression alarm rather than a
      # strict target, so incidental coverage drift doesn't flap CI red.
      - name: Run backend security tests
        run: python -m pytest tests/backend/mystic_auth/security -q --cov-append --cov-fail-under=85

      # Informational only. These assert generous, regression-alarm-level
      # thresholds (not a strict SLA) against a real Postgres/Redis, so
      # timing can be noisy on shared GitHub-hosted runners. A failure here
      # should prompt a look, not block the merge.
      - name: Run backend performance tests (non-blocking)
        continue-on-error: true
        run: python -m pytest tests/backend/mystic_auth/performance -q

  frontend:
    name: Frontend (typecheck + lint + test + build)
    runs-on: ubuntu-latest

    env:
      # Vite exposes VITE_-prefixed process.env vars via import.meta.env
      # directly, no .env file needed (process.env always wins over .env
      # files anyway). See vitest.config.ts / vite.config.ts's envDir.
      # VITE_API_BASE_URL specifically is required because document_api.ts
      # and application_api.ts's URL builders throw loudly on a missing
      # value (see their own docstrings) rather than silently building an
      # "undefined/..." URL, so ResumeEditorPage/ApplicationsPage crash on
      # render without it set. That's what actually fails these tests and
      # the production build, not app or test-selector logic.
      VITE_API_BASE_URL: http://localhost:8000
      VITE_APP_NAME: ManifestCV

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # React Router 8 requires Node 22.22.0 or newer
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Audit npm dependencies for known vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # test:coverage, not plain test, so vitest.config.ts's coverage
      # thresholds are actually evaluated. Plain `vitest run` never collects
      # coverage, so thresholds would silently never be checked.
      - name: Run tests (with coverage threshold gate)
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker image build verification
    runs-on: ubuntu-latest

    # Confirms backend and frontend Dockerfiles still build correctly, and
    # (via the smoke-test steps below) that the actual dev compose stack
    # boots and serves traffic. This catches a class of bug the backend and
    # frontend jobs above can't see at all, since those run the same source
    # code on a bare runner and never go through this image: bad env wiring
    # in docker-compose.yml, a broken healthcheck, a missing file the app
    # needs at runtime. This does not re-run the test suite through Docker.
    # That's what docker-full-suite (below) does, only on a push to main,
    # since re-running identical tests through Docker on every PR would
    # mostly just double CI time for no new bug-catching power over the
    # native runs above.

    steps:
      - uses: actions/checkout@v4

      # Validates docker-compose.yml and docker-compose.prod.yml still parse
      # and reference existing service dependencies. Uses .env.example only
      # to satisfy each file's `env_file: ./.env` directive, no real secrets
      # involved. REDIS_PASSWORD is appended separately because .env.example
      # deliberately ships it empty (a documented local-only convenience,
      # see docs/app/deployment/guide.md), while docker-compose.prod.yml's
      # "${REDIS_PASSWORD:-...}" hard-requires a non-empty value just to
      # parse. So `config` needs *some* placeholder here even though
      # nothing actually runs against it in this step.
      - name: Validate docker-compose configs
        run: |
          cp .env.example .env
          echo "REDIS_PASSWORD=ci-placeholder-redis-password" >> .env
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.local-prod.yml config > /dev/null
          docker compose -f docker-compose.prod.yml config > /dev/null
          rm .env

      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t backend:ci .

      - name: Build frontend production image
        run: docker build --target production -f docker/frontend.Dockerfile -t frontend:ci .

      # Regression guard. backend/logs/ (real request data, paths,
      # timestamps, correlation IDs, written by
      # backend/mystic_auth/logging/logging_config.py) was previously getting
      # baked into the image via `COPY backend/ .`, since *.log alone
      # doesn't match TimedRotatingFileHandler's rotated filenames
      # (access.log.2026-07-19, not access.log.log). That was a real
      # privacy leak, not just wasted space, fixed via .dockerignore. This
      # step catches it coming back. /app/logs itself is expected to exist
      # (backend.Dockerfile creates it empty, so a Docker-managed volume
      # mounted there in dev inherits correct ownership from the image, see
      # docker-compose.yml's own comment on that volume). This checks it's
      # EMPTY, i.e. nothing from a local checkout leaked in via COPY, not
      # that the directory itself is absent.
      - name: Verify no local logs leaked into the backend image
        run: |
          docker run --rm backend:ci sh -c 'test -z "$(ls -A /app/logs 2>/dev/null)"' \
            && echo "OK: /app/logs exists but is empty in the built image" \
            || (echo "FAIL: /app/logs contains files copied into the built image — check .dockerignore" && exit 1)

      # Boots the real dev compose stack (same images/wiring a contributor's
      # `docker compose up` uses) and confirms it actually serves traffic.
      # bugsink/bugsink-seed/taskiq_worker are skipped since nothing below
      # depends on them and they'd only add boot time.
      #
      # BUGSINK_SUPERUSER_EMAIL is blanked out here because bugsink/bugsink-seed
      # aren't part of this invocation. Without this override, the backend's
      # own startup command would wait up to ~10s for a Bugsink DSN file
      # that never arrives, wasting boot budget on a shared CI runner for
      # no reason. Real users running plain `docker compose up` (which does
      # include Bugsink) keep the default. This override is CI-only and
      # never reaches a real deployment.
      - name: Boot the dev stack
        run: |
          cp .env.example .env
          sed -i 's/^BUGSINK_SUPERUSER_EMAIL=.*/BUGSINK_SUPERUSER_EMAIL=/' .env
          docker compose up -d --build postgres redis alembic backend frontend

      - name: Wait for backend to report healthy
        run: timeout 150 sh -c 'until curl -sf http://localhost:8000/health/ready >/dev/null 2>&1; do sleep 3; done'

      - name: Wait for frontend dev server to respond
        run: timeout 60 sh -c 'until curl -sf http://localhost:5173 >/dev/null 2>&1; do sleep 3; done'

      - name: Smoke-test the booted stack
        run: |
          curl -sf http://localhost:8000/health/ready | grep -q '"status":"ok"' \
            && echo "OK: backend /health/ready reports ok through the actual image"
          curl -sf http://localhost:5173 | grep -qi '<div id="root">' \
            && echo "OK: frontend dev server serves the app shell through the actual image"

      # Only runs when something above actually failed. Prints the
      # containers' own logs so a CI failure shows *why* a container never
      # became healthy, instead of just "unhealthy" or a timeout with no context.
      - name: Show container logs (only runs on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down the dev stack
        if: always()
        run: |
          docker compose down -v
          rm -f .env

  real-tectonic:
    name: Real tectonic PDF compilation
    runs-on: ubuntu-latest

    # The `backend` job's own tests/backend/app/integration suite mocks
    # render_resume_pdf everywhere (see that suite's tests), since tectonic
    # is only installed in docker/backend.Dockerfile, not on a bare
    # `ubuntu-latest` runner. This job builds that exact image and runs the
    # two tests marked `real_tectonic` inside a container from it, so a
    # regression in markdown_to_latex.py's LaTeX escaping or a template's
    # preamble (document_generation/templates.py) fails CI, not just
    # production. A mocked render_resume_pdf can't catch either. See
    # tests/backend/app/integration/test_document_routes_integration.py's
    # module docstring.
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manifestcv_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d manifestcv_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: public.ecr.aws/docker/library/redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # Same test-only values as the `backend` job above. See its own env
      # block for why each one is required. Migrations run here via a bare
      # pip install, same as `backend`, since alembic itself doesn't need
      # tectonic. Only the pytest step below needs the built image.
      BACKEND_BASE_URL: http://localhost:8000
      FRONTEND_BASE_URL: http://localhost:5173
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/manifestcv_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manifestcv_ci
      SECRET_KEY: ci-test-secret-key-not-for-production-use-only
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_MINUTES: "43200"
      JWT_ALGORITHM: HS256
      RESET_TOKEN_EXPIRE_MINUTES: "60"
      GOOGLE_CLIENT_ID: ci-test-google-client-id
      GOOGLE_CLIENT_SECRET: ci-test-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/oauth2/callback/google
      REDIS_URL: redis://localhost:6379/0
      CACHE_DEFAULT_TTL: "300"
      FROM_EMAIL: ci-test@example.com
      GMAIL_APP_PASSWORD: ci-test-app-password
      APP_NAME: ManifestCV
      LOGIN_LOCKOUT_TIME: "300"
      MAX_FAILED_LOGIN_ATTEMPTS: "5"
      LOGIN_LOCKOUT_TIME_PER_IP: "300"
      MAX_FAILED_LOGIN_ATTEMPTS_PER_IP: "20"
      MAX_REQUESTS_PER_WINDOW: "100"
      REQUEST_WINDOW_SECONDS: "60"
      GEMINI_API_KEY: ci-test-gemini-api-key
      GEMINI_MODEL: gemini-flash-latest
      GEMINI_EMBEDDING_MODEL: gemini-embedding-001
      QDRANT_URL: http://localhost:6333
      PYTHONPATH: ${{ github.workspace }}
      # The container runs as the non-root `app` user (see
      # docker/backend.Dockerfile), but /repo is a bind mount of this job's
      # checkout, owned by the runner's user, so pytest-cov can't create
      # its SQLite .coverage.* file there. /tmp is writable by any user
      # inside the container.
      COVERAGE_FILE: /tmp/.coverage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies (for the migration step only)
        run: pip install --no-cache-dir -r backend/requirements.txt

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Build backend image (has tectonic installed)
        run: docker build -f docker/backend.Dockerfile -t backend:tectonic-ci .

      # --network host reaches the postgres/redis service containers via
      # localhost, exactly as the bare-runner `backend` job's own tests do.
      # GitHub-hosted ubuntu-latest runners support Docker host networking.
      # -v .../:/repo -w /repo mirrors exactly how docker-compose.yml's own
      # dev backend service runs the top-level test suite locally
      # (`docker compose exec -w /repo backend pytest ...`, see
      # docs/app/docker/overview.md), so this is the same invocation shape
      # a developer already uses, not a CI-only path.
      # backend/mystic_auth/logging/logging_config.py creates backend/logs/
      # (relative to its own file location, resolving to /repo/backend/logs
      # here) at import time, unconditionally. That's the same root cause
      # as the --cov-report=html issue below, but for a vendored module with
      # no env var to redirect it elsewhere. Pre-creating it here, writable
      # by any uid, is a runner-side fix that doesn't touch vendored
      # mystic_auth code, which this repo never hand-edits.
      - name: Pre-create backend/logs, writable by the image's non-root user
        run: mkdir -p backend/logs && chmod 777 backend/logs

      - name: Run real-tectonic PDF compilation tests inside the built image
        # -e VARNAME (no "=value") inherits the value from this step's own
        # shell environment, i.e. exactly the job-level `env:` block above,
        # so there's no need to re-list values here, just the names.
        #
        # -o addopts=... below fully replaces pytest.ini's `addopts`, which
        # includes `--cov-report=html`. That report writes to ./htmlcov
        # under /repo, a bind mount owned by the runner's user, not the
        # image's non-root `app` user. Appending `--cov-report=term` alone
        # isn't enough, since pytest-cov treats --cov-report as additive
        # and the ini's html report would still be attempted and still
        # fail. This job only needs the terminal coverage summary.
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/repo" -w /repo \
            -e BACKEND_BASE_URL -e FRONTEND_BASE_URL -e DATABASE_URL \
            -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB \
            -e SECRET_KEY -e ACCESS_TOKEN_EXPIRE_MINUTES -e REFRESH_TOKEN_EXPIRE_MINUTES \
            -e JWT_ALGORITHM -e RESET_TOKEN_EXPIRE_MINUTES \
            -e GOOGLE_CLIENT_ID -e GOOGLE_CLIENT_SECRET -e GOOGLE_REDIRECT_URI \
            -e REDIS_URL -e CACHE_DEFAULT_TTL -e FROM_EMAIL -e GMAIL_APP_PASSWORD -e APP_NAME \
            -e LOGIN_LOCKOUT_TIME -e MAX_FAILED_LOGIN_ATTEMPTS \
            -e LOGIN_LOCKOUT_TIME_PER_IP -e MAX_FAILED_LOGIN_ATTEMPTS_PER_IP \
            -e MAX_REQUESTS_PER_WINDOW -e REQUEST_WINDOW_SECONDS \
            -e GEMINI_API_KEY -e GEMINI_MODEL -e GEMINI_EMBEDDING_MODEL -e QDRANT_URL \
            -e COVERAGE_FILE \
            backend:tectonic-ci \
            pytest tests/backend/app/integration/test_document_routes_integration.py -k real_tectonic -v \
            -o addopts="-v --cov=backend/app --cov=backend/mystic_auth --cov-report=term"

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans git history, not just the working tree. It needs
          # the full commit log, not just the last commit, to catch a
          # secret that was committed and later removed.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Re-runs the FULL backend and frontend suites through the actual dev
  # compose stack, not bare runners. This is the expensive, high-fidelity
  # check the backend/frontend jobs above intentionally skip on every PR,
  # since the code under test is identical either way and doubling CI time
  # on every push buys little over the native runs above. This job catches
  # the narrower class of bug the native runs structurally can't: something
  # specific to how the containers, images, or compose wiring behave (a
  # subtly wrong volume mount, an entrypoint issue, a dependency present on
  # the runner but missing from the image). Gated to a push to main, not
  # pull_request, since that's the point you're actually merging something
  # in and would want to know if this broke. Deliberately no separate
  # nightly schedule on top of that: a push to main already fires this on
  # every real change to the repo, and a schedule would just add a
  # permanent daily cost for the narrow, rare case of unrelated upstream
  # base-image drift with no corresponding commit.
  docker-full-suite:
    name: Full test suite via Docker (main only)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # See docker-build's identical override above for why
      # BUGSINK_SUPERUSER_EMAIL is blanked here. CI-only, never reaches a
      # real deployment.
      - name: Boot the backend stack
        run: |
          cp .env.example .env
          sed -i 's/^BUGSINK_SUPERUSER_EMAIL=.*/BUGSINK_SUPERUSER_EMAIL=/' .env
          docker compose up -d --build postgres redis alembic backend

      - name: Wait for backend to report healthy
        run: timeout 180 sh -c 'until curl -sf http://localhost:8000/health/ready >/dev/null 2>&1; do sleep 3; done'

      # Same three tiers, same flags, as the native backend job above. This
      # is a repeat, not a different set of tests, run through the actual
      # container this time instead of a bare runner.
      #
      # --user root because pytest-cov writes its .coverage database (and
      # --cov-report=html's htmlcov/) to the current working directory,
      # here /repo, the whole-repo bind mount owned by whatever checked it
      # out (the runner's own user on GitHub Actions, not the container's
      # non-root `app` user). That's a broader version of the same class of
      # bug the /app/logs and /repo/backend/logs volume mounts fix elsewhere,
      # but coverage's output files are spread across whatever cwd it's
      # given rather than one fixed path, so carving out another named
      # volume mount per file doesn't scale. Running this one-off test
      # invocation as root sidesteps the whole class at once: nothing here
      # is the actual served application, which stays non-root by default
      # per backend.Dockerfile's `USER app`, just a throwaway test run
      # inside a container torn down immediately after.
      - name: Run the full backend suite inside the backend container
        run: |
          docker compose exec -T --user root backend bash -c '
            cd /repo &&
            python -m pytest tests/backend/app tests/backend/mystic_auth/unit -q &&
            python -m pytest tests/backend/mystic_auth/integration -q --cov-append &&
            python -m pytest tests/backend/mystic_auth/security -q --cov-append --cov-fail-under=85
          '

      - name: Boot the frontend
        run: docker compose up -d --build frontend

      - name: Run the full frontend suite inside the frontend container
        run: docker compose exec -T frontend sh -c "npm run test -- --run"

      # Only runs when something above actually failed, see docker-build's
      # identical step for why.
      - name: Show container logs (only runs on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          rm -f .env
