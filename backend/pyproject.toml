[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Rules focus on correctness and real bug classes. Style-only rule families
# are avoided to prevent churn in an existing codebase.
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = [
    "E501",   # line-length above is the source of truth.
    "B008",   # FastAPI uses Depends(...) as a default argument by design.
    "UP042",  # str+Enum is kept for broader compatibility.
]

[tool.ruff.lint.isort]
known-first-party = ["app", "mystic_auth"]

[tool.ruff.lint.per-file-ignores]
# Interactive CLI entrypoints run via `python -m`, outside an app event loop.
# Blocking input is intended here.
"mystic_auth/scripts/create_system_user.py" = ["ASYNC250"]
"mystic_auth/scripts/create_rbac_policies.py" = ["ASYNC250"]
# Env overrides must run before the backend.* imports below them, which build
# Settings()/engine/client singletons eagerly at import time from the process env.
"../tests/backend/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.14"
# SQLAlchemy's plugin keeps ORM attributes and generated model constructors
# visible to mypy.
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.bandit]
# B105 flags any string assigned to a name or key containing "password". In
# this codebase those matches are event names, key templates, URLs, or
# `hashed_password: None`, not hardcoded secrets.
skips = ["B105"]
