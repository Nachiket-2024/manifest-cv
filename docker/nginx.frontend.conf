# Serves the built React SPA. Non-file paths fall back to index.html so
# client-side routing works on hard refreshes and deep links.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers for the SPA. This is less strict than the backend API
    # because the frontend serves HTML, JS, and CSS. Tighten connect-src to
    # the real API origin in a concrete deployment. HSTS belongs on the TLS
    # terminator, since this container serves plain HTTP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'none'" always;

    # Proxy only the backend route prefixes registered in backend/app/main.py.
    # This keeps frontend and API traffic on one origin when VITE_API_BASE_URL
    # is empty. $proxy_add_x_forwarded_for preserves an upstream proxy chain,
    # and the backend trusts it only when TRUSTED_PROXY_IPS includes this
    # container's address.
    location ~ ^/(auth|audit|users|authorization|health)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # auth/session-events is long-lived SSE, so buffering and short idle
        # timeouts would delay events or cut the connection.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
