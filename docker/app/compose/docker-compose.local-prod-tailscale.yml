# Your own Compose overrides for this fork, merged on top of upstream's
# docker/mystic_auth/compose/docker-compose.local-prod-tailscale.yml (docker compose -f
# <that file> -f <this file> ...). Ships empty; upstream never edits this
# file again. Add your own services, extra volumes, or env_file entries
# here. See docs/mystic_auth/template-usage/overview.md for the
# mystic_auth/app split this mirrors.
x-logging: &logging_defaults
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  qdrant:
    <<: *logging_defaults
    image: qdrant/qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    <<: *logging_defaults
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      - resume_artifacts:/var/lib/manifestcv/resume-artifacts

volumes:
  qdrant_data:
  resume_artifacts:
