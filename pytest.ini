[pytest]
testpaths = tests/backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=backend/app --cov=backend/mystic_auth --cov-report=html
# --cov-fail-under is not set here because it would affect partial local runs.
# CI enforces the threshold once against cumulative unit, integration, and
# security coverage.
